name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            package: Leitner-macOS.zip
          - name: Windows
            os: windows-latest
            package: Leitner-Windows.zip
          - name: Linux
            os: ubuntu-22.04
            package: Leitner-Linux.tar.gz
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libegl-dev \
            libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev ninja-build

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then GEN="-G Ninja"; else GEN=""; fi
          cmake -B build $GEN -DCMAKE_BUILD_TYPE=Release -DLEITNER_BUILD_TESTS=ON -DLEITNER_COPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release --target Leitner_All LeitnerTest --parallel 4

      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: ./build/LeitnerTest_artefacts/Release/LeitnerTest "$RUNNER_TEMP/shots"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          A=build/Leitner_artefacts/Release
          mkdir -p dist/Leitner
          cp -R "$A/Standalone/Leitner.app" "$A/AU/Leitner.component" "$A/VST3/Leitner.vst3" dist/Leitner/
          # ad-hoc signatures (not notarised: the Homebrew cask clears the quarantine)
          codesign --force --deep -s - dist/Leitner/Leitner.app
          codesign --force --deep -s - dist/Leitner/Leitner.component
          codesign --force --deep -s - dist/Leitner/Leitner.vst3
          cp README.md LICENSE "docs/manual/Leitner Manual.pdf" dist/Leitner/
          cd dist && ditto -c -k --keepParent Leitner "${{ matrix.package }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $A = "build/Leitner_artefacts/Release"
          New-Item -ItemType Directory -Force "dist/Leitner" | Out-Null
          Copy-Item -Recurse "$A/VST3/Leitner.vst3" "dist/Leitner/"
          Copy-Item "$A/Standalone/Leitner.exe" "dist/Leitner/"
          Copy-Item README.md, LICENSE, "docs/manual/Leitner Manual.pdf" "dist/Leitner/"
          Compress-Archive -Path "dist/Leitner" -DestinationPath "dist/${{ matrix.package }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          A=build/Leitner_artefacts/Release
          mkdir -p dist/Leitner
          cp -R "$A/VST3/Leitner.vst3" "$A/LV2/Leitner.lv2" dist/Leitner/
          cp "$A/Standalone/Leitner" dist/Leitner/
          cp Resources/icon_1024.png dist/Leitner/leitner.png
          cp README.md LICENSE "docs/manual/Leitner Manual.pdf" dist/Leitner/
          tar -czf "dist/${{ matrix.package }}" -C dist Leitner

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/${{ matrix.package }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Checksums
        run: cd packages && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
